# Strict lint set from Very Good Ventures. It is a superset of flutter_lints.
# https://pub.dev/packages/very_good_analysis
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # This is an app, not a published package: doc comments on every public
    # member add noise. Document non-obvious domain logic by hand instead.
    public_member_api_docs: false
