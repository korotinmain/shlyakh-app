name: shlyakh
description: "Shlyakh: a personal walking tracker for iOS. Steps light the stars of real constellations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  clock: ^1.1.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  meta: ^1.19.0
  riverpod_annotation: ^4.0.7
  sqlite3: ^3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.0.4
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  assets:
    - assets/fonts/geologica/OFL.txt
    - assets/sky/route.json
    - assets/licenses/sky.txt
  fonts:
    - family: Geologica
      fonts:
        - asset: assets/fonts/geologica/Geologica-Variable.ttf

  uses-material-design: true
